[package]
name = "hardmoney-py"
version = "3.1.1"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0 OR BSD-3-Clause"
description = "Python bindings for hardmoney: an FEC electronic-filing (.fec) parser, writer, validator, and cover-page reconciler with exact decimal money."
readme = "README.md"
repository = "https://github.com/cgorski/hardmoney"
homepage = "https://github.com/cgorski/hardmoney"
keywords = ["fec", "campaign-finance", "python", "pyo3"]
categories = ["parser-implementations"]
# Distributed as a Python wheel (PyPI), never as a crate.
publish = false

# A standalone package, not a member of the parent crate: the parent is not
# a workspace and must package cleanly without this directory (it excludes
# `/python`). The empty table stops Cargo searching upward for one.
[workspace]

[lib]
name = "_hardmoney"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
# Parser-only build of the parent crate: no tokio, sqlx, or axum in the
# wheel. `fetch` gives `hardmoney.fetch(filing_id)`; `serde` is what the
# parent's `Filing`/`Header` serialisation needs.
hardmoney = { path = "..", default-features = false, features = ["fetch", "serde"] }
# `abi3-py39`: one wheel per platform for every CPython >= 3.9.
# `rust_decimal`: `Decimal` -> `decimal.Decimal` via its string form (exact).
# `chrono`: `NaiveDate` -> `datetime.date`.
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py39", "rust_decimal", "chrono"] }
rust_decimal = { version = "1", default-features = false, features = ["std"] }
chrono = { version = "0.4", default-features = false }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
