[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "hardmoney"
version = "2.1.0"
description = "FEC electronic filings (.fec) in Python: parse, write, validate, and reconcile campaign-finance reports with exact decimal money. Rust core (hardmoney) via PyO3."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0 OR BSD-3-Clause"
authors = [{ name = "cgorski" }]
keywords = ["fec", "campaign-finance", "election", "parser", "government-data", "fecfile"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Legal Industry",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Rust",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Text Processing",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/cgorski/hardmoney"
Documentation = "https://cgorski.github.io/hardmoney/python.html"
Repository = "https://github.com/cgorski/hardmoney"
Changelog = "https://github.com/cgorski/hardmoney/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.maturin]
# The Rust cdylib is `hardmoney/_hardmoney.abi3.so`; the pure-Python
# package (`__init__.py`, stubs, `py.typed`) lives under `python/`.
python-source = "python"
module-name = "hardmoney._hardmoney"
strip = true

[tool.pytest.ini_options]
testpaths = ["tests"]
