# A throwaway Postgres for developing and testing hardmoney, configured
# exactly as .github/workflows/ci.yml configures its service container:
# same role, password, and database, so the test URL is the same string.
#
#   docker compose up -d --wait          # start (PG 18; PG_VERSION=15 for the FEC's version)
#   export HARDMONEY_TEST_DATABASE_URL=postgres://hardmoney:hardmoney@127.0.0.1:5433/hardmoney_test
#   cargo test --all-features            # the Postgres integration tests now run instead of skipping
#   docker compose down -v               # stop and discard the data
#
# or `scripts/dev-postgres.sh up|test|psql|down`, which does the above.
#
# Host port 5433 by default (PG_PORT=... to change), so a Postgres already
# on 5432 -- Homebrew's, or Postgres.app -- is left alone.

services:
  postgres:
    image: postgres:${PG_VERSION:-18}
    environment:
      POSTGRES_USER: hardmoney
      POSTGRES_PASSWORD: hardmoney
      POSTGRES_DB: hardmoney_test
    ports:
      - "${PG_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hardmoney -d hardmoney_test"]
      interval: 2s
      timeout: 5s
      retries: 30
    # The test suite creates and drops one namespace (schema) per test in
    # parallel; the FEC's pg_dump restores (tests that need a local
    # archive) want a little more shared memory than the image's default.
    shm_size: 256mb
    volumes:
      # The 18+ images keep the cluster in a version subdirectory under
      # /var/lib/postgresql, so that is the mount point (not .../data,
      # which the 18 image refuses to start with); it also works for 15.
      - pgdata:/var/lib/postgresql

volumes:
  pgdata:
