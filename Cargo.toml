[package]
build = "build.rs"
name = "hardmoney"
version = "3.1.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0 OR BSD-3-Clause"
description = "FEC campaign-finance data toolkit: a .fec electronic-filing parser (spec 3.x through 8.5), typed views with exact decimal money, a Postgres bulk-data ETL, and a REST API -- usable as a library or as the `hardmoney` CLI."
readme = "README.md"
repository = "https://github.com/cgorski/hardmoney"
homepage = "https://github.com/cgorski/hardmoney"
documentation = "https://docs.rs/hardmoney"
keywords = ["fec", "campaign-finance", "election", "parser", "government-data"]
categories = ["parser-implementations", "database"]
exclude = ["/book", "/.github", "/scripts", "/tmp", "/.gitignore", "/data/fec-spec/*.xlsx", "/python"]

[package.metadata.docs.rs]
all-features = true

[lib]
name = "hardmoney"
path = "src/lib.rs"

[[bin]]
name = "hardmoney"
path = "src/main.rs"
required-features = ["cli"]

[build-dependencies]
# build.rs compiles data/fec-csv-sources/*.csv (column layouts per spec
# version) and data/fec-spec/spec-*.json (the FEC's field types, lengths,
# and rules) into static Rust tables, so a stale generated file is
# impossible.
csv = "1.3"
regex = "1.10"
serde_json = "1"

[dependencies]
# parser (always available)
csv = "1.3"
regex = "1.10"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
# Most FEC field values (dates, amounts, codes, IDs, ZIPs) are <= 24 bytes;
# CompactString stores those inline with no heap allocation, which roughly
# halves the memory of a parsed 700k-line presidential filing.
compact_str = "0.9"
# Display/FromStr/iteration derives for the crate's closed-set enums.
strum = { version = "0.28", features = ["derive"] }
# Exact base-10 decimal money type, used everywhere hardmoney represents a
# dollar amount (parsing, typed views, bulk ETL, REST API). Never round-trips
# money through `f64`: FEC amounts are decimal currency values, and binary
# floating point cannot represent every decimal fraction exactly.
rust_decimal = { version = "1", default-features = false, features = ["std"] }
encoding_rs = "0.8"
ureq = { version = "3", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
# preserve_order: JSON objects keep the FEC's column order instead of sorting keys.
serde_json = { version = "1", features = ["preserve_order"], optional = true }

# bulk ETL (optional)
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "macros", "migrate", "rust_decimal"], optional = true }
# sqlx-postgres 0.9.0 depends on `whoami` with default-features = false,
# which stubs out the Unix username lookup and reports "anonymous" when a
# DATABASE_URL omits the user (sqlx#4277). Enabling `std` here restores the
# lookup. Remove once sqlx ships the fix.
whoami = { version = "2", default-features = false, features = ["std"], optional = true }
zip = { version = "8", default-features = false, features = ["deflate"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "net", "signal"], optional = true }
indicatif = { version = "0.18", optional = true }

# api (optional)
axum = { version = "0.8", optional = true }
tower = { version = "0.5", features = ["timeout", "util"], optional = true }
tower-http = { version = "0.7", features = ["trace", "cors", "timeout", "validate-request", "limit"], optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
# The browser UI (`hardmoney serve --ui`) is embedded in the binary so a
# deployment is one file. `debug-embed` embeds in debug builds too, so tests
# and `cargo run` exercise the same bytes a release binary ships.
rust-embed = { version = "8", default-features = false, features = ["debug-embed"], optional = true }

# export (optional): `hardmoney export` and the `export` module. Parquet
# needs the Arrow columnar model; `zstd` is the only codec we write.
# SQLite is compiled in (`bundled`) so the binary has no system dependency.
# rusqlite is held at 0.39 (libsqlite3-sys 0.37) because sqlx 0.9's
# optional sqlx-sqlite requires libsqlite3-sys < 0.38, and Cargo allows only
# one crate in the lockfile to `links = "sqlite3"` even when the feature
# that would pull it in is off. Bump alongside sqlx.
arrow = { version = "59", default-features = false, optional = true }
parquet = { version = "59", default-features = false, features = ["arrow", "zstd"], optional = true }
rusqlite = { version = "0.39", features = ["bundled"], optional = true }

# cli (optional, required for the `hardmoney` binary)
clap = { version = "4", features = ["derive", "env"], optional = true }
dotenvy = { version = "0.15", optional = true }

[features]
default = ["fetch", "bulk", "api", "cli", "export"]
# `zip` is here as well as in `bulk` because the `fec` module (behind
# `fetch`) reads the FEC's daily e-filing archives; `deflate` only, so the
# parser-only build stays free of tokio/sqlx/axum.
fetch = ["dep:ureq", "dep:zip"]
serde = ["dep:serde", "dep:serde_json", "rust_decimal/serde", "compact_str/serde"]
export = ["dep:arrow", "dep:parquet", "dep:rusqlite", "serde"]
bulk = ["dep:sqlx", "dep:whoami", "dep:zip", "dep:tokio", "dep:ureq", "dep:indicatif", "serde"]
api = ["dep:axum", "dep:tower", "dep:tower-http", "dep:tracing", "dep:tracing-subscriber", "dep:tokio", "dep:rust-embed", "bulk", "serde"]
cli = ["dep:clap", "dep:dotenvy", "bulk", "api", "fetch", "export"]

[dev-dependencies]
rust_decimal_macros = "1"
tower = { version = "0.5", features = ["util"] }
zip = { version = "8", default-features = false, features = ["deflate"] }
# Property tests: writer/parser round-trips over arbitrary field values.
proptest = "1"
# benches/parse.rs: eager `Filing::parse_bytes` vs. streaming `FilingReader`.
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "parse"
harness = false

[profile.release]
opt-level = 3
