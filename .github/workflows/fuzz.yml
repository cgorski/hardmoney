name: Fuzz

# Coverage-guided fuzzing of the .fec parser, writer, validator, and
# reconciler (fuzz/, cargo-fuzz on nightly). Nightly for ten minutes per
# target, seeded from tests/fixtures/ and from the corpus the previous run
# evolved (kept in the Actions cache), so coverage compounds instead of
# restarting from the seeds every night.
#
# On a crash the minimised input is uploaded as an artifact. Reproduce
# with `cargo +nightly fuzz run <target> <file>`, minimise with `tmin`, and
# turn it into a regression test in src/parser/writer.rs or
# tests/parser_adversarial.rs (not into the corpus). ci.yml type-checks the
# targets on stable on every push so they cannot rot between runs.

on:
  schedule:
    - cron: "17 3 * * *"  # daily, 03:17 UTC
  workflow_dispatch:
    inputs:
      seconds:
        description: "Seconds per target"
        required: false
        default: "600"
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [parse_bytes, stream_vs_eager, roundtrip, validate_reconcile]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      # The evolved corpus from the last run; the key always misses so the
      # newest matching prefix is restored and a fresh copy saved below.
      - name: Restore the evolved corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - name: Seed from the fixtures
        run: ./fuzz/seed.sh

      - name: Fuzz
        env:
          SECONDS_PER_TARGET: ${{ inputs.seconds || '600' }}
        run: |
          cd fuzz
          cargo fuzz run --locked ${{ matrix.target }} -- \
            -dict=dictionary.dict -max_len=65536 -rss_limit_mb=4096 -timeout=30 \
            -max_total_time="$SECONDS_PER_TARGET"

      - name: Minimise the corpus for the cache
        if: always()
        run: cd fuzz && cargo fuzz cmin --locked ${{ matrix.target }}
      - name: Save the evolved corpus
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/
          if-no-files-found: ignore
