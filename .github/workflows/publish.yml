name: Publish to crates.io

# Manual only. Publishing requires:
#   1. a human to dispatch this workflow with the version to publish,
#   2. that version to match Cargo.toml on main,
#   3. an annotated/lightweight tag `v<version>` pointing at HEAD,
#   4. approval in the `crates-io` environment (configure a required
#      reviewer on that environment in the repo settings; the CRATES_IO
#      secret should live there, not at repo level),
#   5. the full test suite passing -- against a Postgres service, so the
#      integration tests in tests/postgres_integration.rs run rather than
#      skip (under GitHub Actions they fail if the database is missing).
# Nothing here runs on push or tag events. Dispatch with `dry_run` to
# rehearse everything up to, but not including, the upload; a dry run
# usually happens before the tag exists, so in that mode the tag check
# reports its result without stopping the rehearsal.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (must equal Cargo.toml `version` and tag v<version> at HEAD)"
        required: true
        type: string
      dry_run:
        description: "Run every check and `cargo publish --dry-run`, but do not publish"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish:
    name: cargo publish ${{ inputs.version }}${{ inputs.dry_run && ' (dry run)' || '' }}
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: crates-io
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: hardmoney
          POSTGRES_PASSWORD: hardmoney
          POSTGRES_DB: hardmoney_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hardmoney"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CARGO_TERM_COLOR: always
      HARDMONEY_TEST_DATABASE_URL: postgres://hardmoney:hardmoney@localhost:5432/hardmoney_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # The tag check below fetches over the public HTTPS remote; no
          # token needs to be left in the checkout's git config.
          persist-credentials: false

      - name: Verify Cargo.toml version matches the requested version
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          set -euo pipefail
          declared="$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "([^"]+)"/\1/')"
          echo "Cargo.toml: $declared  requested: $REQUESTED"
          test "$declared" = "$REQUESTED"

      - name: Verify tag v${{ inputs.version }} points at HEAD
        # A dry run is rehearsed before tagging: report, do not stop.
        continue-on-error: ${{ inputs.dry_run }}
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          tagged="$(git rev-parse -q --verify "refs/tags/v${REQUESTED}^{commit}" || true)"
          head="$(git rev-parse HEAD)"
          echo "tag: ${tagged:-<missing>}  head: $head"
          test -n "$tagged" && test "$tagged" = "$head"

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Test (all features, parser + Postgres integration)
        run: cargo test --locked --all-features

      - name: Verify package (dry run)
        run: cargo publish --locked --dry-run --all-features

      - name: Publish to crates.io
        if: ${{ !inputs.dry_run }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO }}
        run: cargo publish --locked --all-features
