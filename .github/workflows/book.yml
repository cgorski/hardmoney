name: Book

on:
  push:
    branches: [main]
    paths:
      - "book/**"
      - "python/python/hardmoney/_hardmoney.pyi"
      - "scripts/gen_python_api.py"
      - ".github/workflows/book.yml"
  workflow_dispatch:

# The build job needs only to read the checkout; the Pages permissions
# are granted to the deploy job alone.
permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: mdbook build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install mdBook
        run: |
          mkdir -p "$HOME/.cargo/bin"
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.5.2/mdbook-v0.5.2-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C "$HOME/.cargo/bin"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # Renders the ```mermaid blocks in book/src/architecture.md. The two
      # pins must move together: mdbook-mermaid 0.17.x targets mdBook 0.5.x
      # (0.16.x was for 0.4.x and fails under 0.5 with "Unable to parse the
      # input").
      - name: Install mdbook-mermaid
        run: |
          curl -sSL https://github.com/badboy/mdbook-mermaid/releases/download/v0.17.1/mdbook-mermaid-v0.17.1-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C "$HOME/.cargo/bin"
          mdbook-mermaid --version

      # book/src/python-api.md is generated from the Python type stub and
      # committed so a local `mdbook build` needs no extra step. Regenerate
      # it to a temporary path and fail if the committed copy is stale (the
      # script needs only the standard library; no Rust build).
      - name: Check the generated Python API reference is current
        run: |
          python3 scripts/gen_python_api.py --output "$RUNNER_TEMP/python-api.md"
          if ! diff -u book/src/python-api.md "$RUNNER_TEMP/python-api.md"; then
            echo "::error file=book/src/python-api.md::stale; run python3 scripts/gen_python_api.py and commit the result"
            exit 1
          fi

      - name: Build book
        run: mdbook build book

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: book/book

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
