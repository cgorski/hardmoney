name: Python

# Builds and tests the `hardmoney` Python package (python/): a PyO3 +
# maturin extension over the parser-only build of the parent crate.
#
# On every push and pull request: lint, test on three operating systems,
# build one abi3 wheel per platform and the sdist, upload them as workflow
# artifacts.
#
# On a `v*` tag, additionally:
#   * `attest` signs a build-provenance attestation for every wheel and the
#     sdist (verify with `gh attestation verify <file> --repo cgorski/hardmoney`);
#   * `release` creates a DRAFT GitHub Release for the tag -- notes from the
#     version's CHANGELOG.md section, the attested wheels and sdist
#     attached -- for the maintainer to publish once the registries are
#     updated (the supply-chain workflow attaches the SBOM to the same
#     draft). A draft is visible to maintainers only;
#   * `publish` uploads to PyPI, but only when the repository variable
#     PYPI_PUBLISH is `true` and the secret PYPI_API_TOKEN is set (both are;
#     without them the job is skipped and nothing leaves GitHub), and only
#     after the maintainer approves the run in the `pypi` environment, which
#     admits `v*` tags alone. See book/src/security-and-provenance.md
#     ("How releases are cut").

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request supersedes its running checks; pushes to
# main and tags all run to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: cargo fmt + clippy (python/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: python
      - run: cargo fmt --check
        working-directory: python
      - run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: python
      - run: cargo doc --locked --no-deps
        working-directory: python
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: maturin develop + pytest (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # The oldest interpreter the abi3-py39 wheel supports and a current one.
        python: ["3.9", "3.13"]
    defaults:
      run:
        shell: bash
        working-directory: python
    env:
      # `python -m venv` puts the interpreter under bin/ on POSIX and
      # Scripts/ on Windows.
      VENV_BIN: ${{ matrix.os == 'windows-latest' && '.venv/Scripts' || '.venv/bin' }}
      VIRTUAL_ENV: ${{ github.workspace }}/python/.venv
      # The Windows console code page is not UTF-8; the tests run the
      # example scripts as subprocesses and compare their stdout, some of
      # which carries non-ASCII contributor names from real filings.
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: python
      - name: Create venv and install build/test tools
        run: |
          python -m venv .venv
          "$VENV_BIN/python" -m pip install --upgrade pip maturin pytest
      - name: Build and install the extension into the venv
        run: '"$VENV_BIN/maturin" develop --release --locked'
      - name: pytest (real fixtures from tests/fixtures/)
        run: '"$VENV_BIN/python" -m pytest -q'

  wheels:
    name: build wheel (${{ matrix.os }}, ${{ matrix.target }})
    needs: [lint, test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # One abi3 wheel per platform the PyPI page promises (Linux x86_64
        # and aarch64, macOS Intel and Apple silicon) plus Windows x86_64.
        # Every leg builds on native hardware so the smoke test below runs
        # the wheel it just built.
        include:
          - os: ubuntu-latest
            target: x86_64
          - os: ubuntu-24.04-arm
            target: aarch64
          - os: macos-latest
            target: aarch64
          - os: macos-15-intel
            target: x86_64
          - os: windows-latest
            target: x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build abi3 wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: python
          target: ${{ matrix.target }}
          # manylinux: the parent crate is a path dependency (`..`), which
          # the container sees because the whole checkout is mounted.
          # Ignored on macOS and Windows, which build on the host.
          manylinux: auto
          # --locked: the wheel is built from python/Cargo.lock exactly, so
          # the SBOM in the supply-chain workflow describes these bytes.
          args: --release --locked --out dist
          sccache: "true"
      - name: Smoke-test the wheel
        shell: bash
        env:
          PYTHONUTF8: "1"
        run: |
          python -m venv smoke
          if [ -x smoke/bin/python ]; then bin=smoke/bin; else bin=smoke/Scripts; fi
          "$bin/python" -m pip install --upgrade pip pytest
          "$bin/python" -m pip install dist/*.whl
          "$bin/python" -c "import hardmoney; print(hardmoney.__version__, hardmoney.BUNDLED_SPEC_VERSION, len(hardmoney.tables()))"
          "$bin/python" -m pytest -q tests
        working-directory: python
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: python/dist/*.whl
          if-no-files-found: error

  sdist:
    name: build sdist
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: python
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdist
          path: python/dist/*.tar.gz
          if-no-files-found: error

  # SLSA-style build provenance: a Sigstore-signed statement, stored by
  # GitHub, that each file below was produced by this workflow at this
  # commit. Anyone can check a downloaded wheel with
  #   gh attestation verify hardmoney-*.whl --repo cgorski/hardmoney
  attest:
    name: build provenance attestations
    needs: [wheels, sdist]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sdist
          path: dist
      - run: ls -l dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

  # A draft GitHub Release for the tag, holding the CHANGELOG section as
  # notes and the exact files attested above. Only this job may write to
  # the repository, and only to create or update the draft; publishing it
  # is the maintainer's click after PyPI and crates.io are done.
  release:
    name: draft GitHub Release
    needs: [attest]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sdist
          path: dist
      - name: Release notes from CHANGELOG.md
        run: |
          python3 - "$TAG" > "$RUNNER_TEMP/notes.md" <<'EOF'
          import re, sys
          version = sys.argv[1].removeprefix("v")
          text = open("CHANGELOG.md", encoding="utf-8").read()
          # "## 3.2.0 — 2026-09-16" up to the next "## " heading.
          m = re.search(rf"^## {re.escape(version)}\b[^\n]*\n(.*?)(?=^## |\Z)", text, re.M | re.S)
          body = m.group(1).strip() if m else f"See `CHANGELOG.md` for {version}."
          print(body)
          print()
          print("---")
          print("The wheels and sdist attached here are the files this workflow built and attested;")
          print("verify one with `gh attestation verify <file> --repo cgorski/hardmoney`. The")
          print("CycloneDX SBOMs are attached by the Supply chain workflow. Provenance, licences,")
          print("and how releases are cut: https://cgorski.github.io/hardmoney/security-and-provenance.html")
          EOF
          cat "$RUNNER_TEMP/notes.md"
      # No release for the tag yet: create a draft with these notes. A
      # draft already there (the supply-chain run may create one with
      # placeholder notes): fill in the notes. A release the maintainer
      # has published: leave its notes and state alone, only attach files.
      - name: Create or fill in the draft release
        run: |
          set -euo pipefail
          if is_draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft 2>/dev/null); then
            if [ "$is_draft" = "true" ]; then
              gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
                --title "hardmoney $TAG" --notes-file "$RUNNER_TEMP/notes.md"
            else
              echo "release $TAG is already published; leaving its notes alone"
            fi
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
              --title "hardmoney $TAG" --notes-file "$RUNNER_TEMP/notes.md" \
              || gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null
          fi
      - name: Attach the wheels and sdist
        run: |
          set -euo pipefail
          ls -l dist
          gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber

  # Publishes to PyPI on a `v*` tag, gated twice:
  #   * the repository variable PYPI_PUBLISH must be exactly `true`
  #     (Settings > Secrets and variables > Actions > Variables), else the
  #     job is skipped;
  #   * the secret PYPI_API_TOKEN must hold a PyPI API token scoped to the
  #     `hardmoney` project, else the first step fails with a clear message
  #     before anything is uploaded.
  # Wheels and the sdist are the exact files attested above.
  publish:
    name: publish to PyPI
    needs: [attest]
    if: startsWith(github.ref, 'refs/tags/v') && vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - name: Check that PYPI_API_TOKEN is set
        env:
          TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::PYPI_PUBLISH is 'true' but the secret PYPI_API_TOKEN is empty; nothing was uploaded. Add the token (or set PYPI_PUBLISH to 'false')."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check that the tag matches python/pyproject.toml
        run: |
          set -euo pipefail
          declared="$(grep -m1 '^version = ' python/pyproject.toml | sed -E 's/version = "([^"]+)"/\1/')"
          tag="${GITHUB_REF_NAME#v}"
          echo "pyproject.toml: $declared  tag: $tag"
          test "$declared" = "$tag"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sdist
          path: dist
      - run: ls -l dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1 (v1.14.2)
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: dist
          print-hash: true
          # PEP 740 attestations need Trusted Publishing (OIDC), not a
          # token. Switching to it is the documented next step; the GitHub
          # build-provenance attestations above cover the same files.
          attestations: false
