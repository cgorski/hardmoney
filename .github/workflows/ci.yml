name: CI

# Every third-party action is pinned to a commit (the version it
# corresponds to is in the trailing comment; Dependabot bumps both). Cargo
# runs with --locked so a Cargo.lock that has fallen behind Cargo.toml
# fails here instead of being re-resolved on the runner, which would make
# the SBOM in supply-chain.yml describe different bytes than were tested.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request supersedes its running checks; pushes to
# main all run to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: cargo fmt --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all --check

  fixtures:
    name: fixture manifest and line endings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # tests/fixtures/MANIFEST.sha256 must describe the committed fixture
      # bytes (a new or changed fixture needs `python3 scripts/fixture_manifest.py`),
      # and no tracked text file may carry CRLF: .gitattributes normalises
      # to LF, and a CRLF here means a file was added without it applying.
      - run: python3 scripts/fixture_manifest.py --check
      - name: No CRLF in tracked text files
        run: |
          set -euo pipefail
          if git ls-files --eol | grep -E '^i/(crlf|mixed)'; then
            echo "::error::tracked text files with CRLF or mixed line endings (see .gitattributes)"
            exit 1
          fi
          echo "all tracked text files are LF"

  clippy:
    name: cargo clippy --all-features
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --locked --all-features --all-targets -- -D warnings

  docs:
    name: cargo doc (deny warnings)
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo doc --locked --all-features --no-deps

  msrv:
    name: build on MSRV (parser only + all features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: "1.94"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --locked --no-default-features --features fetch
      - run: cargo build --locked --all-features

  test:
    name: cargo test --all-features (Postgres ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 18: Aurora PostgreSQL's newest major, the deployment target; this
        #     leg runs the whole suite.
        # 15: what the FEC runs (FECfile+ and the weekly pg_dump archives are
        #     produced on PG15). Only tests/postgres_integration.rs touches
        #     the database, so this leg runs that binary alone to keep the
        #     matrix cheap.
        postgres: [15, 18]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: hardmoney
          POSTGRES_PASSWORD: hardmoney
          POSTGRES_DB: hardmoney_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hardmoney"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      HARDMONEY_TEST_DATABASE_URL: postgres://hardmoney:hardmoney@localhost:5432/hardmoney_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: pg${{ matrix.postgres }}
      - name: Build (all features)
        run: cargo build --locked --all-features --verbose
      - name: Test (all features, parser + Postgres integration)
        if: matrix.postgres == 18
        run: cargo test --locked --all-features --verbose
      - name: Test (Postgres integration only)
        if: matrix.postgres != 18
        run: cargo test --locked --all-features --test postgres_integration --verbose
      - name: Test (parser only, no default features)
        if: matrix.postgres == 18
        run: cargo test --locked --no-default-features --features fetch

  package:
    name: cargo package (verifies the crate builds from its tarball)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo package --locked --all-features
