name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: cargo fmt --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: cargo clippy --all-features
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-features --all-targets -- -D warnings

  docs:
    name: cargo doc (deny warnings)
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --all-features --no-deps

  msrv:
    name: build on MSRV (parser only + all features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94"
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --no-default-features --features fetch
      - run: cargo build --all-features

  test:
    name: cargo test --all-features (Postgres ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 18: Aurora PostgreSQL's newest major, the deployment target; this
        #     leg runs the whole suite.
        # 15: what the FEC runs (FECfile+ and the weekly pg_dump archives are
        #     produced on PG15). Only tests/postgres_integration.rs touches
        #     the database, so this leg runs that binary alone to keep the
        #     matrix cheap.
        postgres: [15, 18]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: hardmoney
          POSTGRES_PASSWORD: hardmoney
          POSTGRES_DB: hardmoney_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hardmoney"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      HARDMONEY_TEST_DATABASE_URL: postgres://hardmoney:hardmoney@localhost:5432/hardmoney_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: pg${{ matrix.postgres }}
      - name: Build (all features)
        run: cargo build --all-features --verbose
      - name: Test (all features, parser + Postgres integration)
        if: matrix.postgres == 18
        run: cargo test --all-features --verbose
      - name: Test (Postgres integration only)
        if: matrix.postgres != 18
        run: cargo test --all-features --test postgres_integration --verbose
      - name: Test (parser only, no default features)
        if: matrix.postgres == 18
        run: cargo test --no-default-features --features fetch

  package:
    name: cargo package (verifies the crate builds from its tarball)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo package --all-features
