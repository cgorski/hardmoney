# Weekly dependency update proposals. Security advisories are caught
# sooner by .github/workflows/supply-chain.yml (cargo audit / cargo deny on
# every push and weekly); this keeps the lockfiles and the pinned actions
# current in between.
version: 2
updates:
  # The crate (Cargo.lock at the repository root), the Python extension
  # crate (python/Cargo.lock; PyO3 and maturin live there), and the fuzz
  # targets (fuzz/Cargo.lock; libfuzzer-sys) in ONE entry. python/ and
  # fuzz/ are standalone packages that path-depend on `..`, so the three
  # lockfiles must move together: a bump to a dependency of the root crate
  # has to land in the other two as well, and Dependabot's cargo updater
  # follows the path dependency and edits the root Cargo.toml from the
  # dependent's side. As separate entries every such PR failed CI
  # (`--locked` on a lockfile the entry did not update); with all three
  # directories in one grouped entry, one PR updates them all.
  - package-ecosystem: cargo
    directories:
      - /
      - /python
      - /fuzz
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps(cargo)"
    groups:
      # Every cargo bump arrives as one PR touching both lockfiles.
      cargo:
        patterns: ["*"]

  # python/pyproject.toml: the maturin build requirement and the pytest
  # test extra. The wheel itself has no Python dependencies.
  - package-ecosystem: pip
    directory: /python
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(pip)"

  # Actions pinned in .github/workflows/*.yml.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(actions)"
    groups:
      actions:
        patterns: ["*"]
